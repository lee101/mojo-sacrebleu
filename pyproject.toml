[project]
name = "mojo-sacrebleu"
version = "0.1.0"
description = "Mojo-backed BLEU, chrF, and TER metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "bleu", "chrf", "ter", "machine-translation"]
dependencies = ["numpy", "regex"]

[project.optional-dependencies]
dev = ["pytest", "sacrebleu"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-sacrebleu"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
